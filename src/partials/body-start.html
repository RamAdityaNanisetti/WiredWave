<body class="overflow-x-hidden">

    <canvas id="network-canvas"></canvas>

    <!-- PDF Viewer Modal -->
    <div id="pdf-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-10 opacity-0 pointer-events-none transform scale-95 transition-all duration-300">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative w-full h-full max-w-6xl bg-[#0f172a] rounded-2xl border border-white/10 shadow-2xl overflow-hidden flex flex-col">
            <div class="flex justify-between items-center px-6 py-4 border-b border-white/5 bg-[#1e293b]">
                <h3 id="modal-title" class="text-sm font-bold uppercase tracking-widest text-slate-300">Document Viewer</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex-1 bg-white">
                <iframe id="pdf-frame" src="" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </div>
