<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiredWave | Enterprise Infrastructure & Network Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0b1120;
            --accent-blue: #3b82f6;
            --accent-cyan: #2dd4bf;
            --terminal-bg: rgba(15, 23, 42, 0.85);
        } 

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .text-gradient {
            background: linear-gradient(to right, #60a5fa, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .kerning-tight { letter-spacing: -0.04em; }

        #network-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        /* Disguised Image Integration */
        .hero-image-integration {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 120%;
            height: 140%;
            z-index: -1;
            opacity: 0.15;
            filter: saturate(0) contrast(1.2) brightness(0.8);
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            pointer-events: none;
            object-fit: cover;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
        }

        .terminal-window {
            background: var(--terminal-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .bento-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bento-card:hover {
            transform: translateY(-4px);
            background: rgba(30, 41, 59, 0.5);
            border-color: var(--accent-blue);
        }

        .btn-primary {
            background-color: var(--accent-blue);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        .request-link {
            position: relative;
            display: inline-block;
        }

        .request-link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 2px;
            background: var(--accent-blue);
        }

        #pdf-modal {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
        
        .modal-open {
            transform: translateY(0) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        header, section, footer { position: relative; z-index: 10; }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3.5rem !important;
                line-height: 1.1 !important;
            }
            .hero-image-integration {
                width: 150%;
                right: -25%;
                opacity: 0.1;
            }
        }
    </style>
</head>
