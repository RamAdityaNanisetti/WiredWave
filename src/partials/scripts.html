    <!-- Scripts -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuToggle && mobileMenu) {
            const menuPath = document.getElementById('menu-path-1');
            const hamburgerPath = "M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z";
            const closePath = "M18.3 5.71a1 1 0 00-1.41 0L12 10.59 7.11 5.7a1 1 0 00-1.42 1.42L10.59 12l-4.9 4.89a1 1 0 001.42 1.42L12 13.41l4.89 4.9a1 1 0 001.42-1.42L13.41 12l4.89-4.89a1 1 0 000-1.4z";

            const toggleMenu = (show) => {
                const isHidden = show !== undefined ? !show : !mobileMenu.classList.contains('hidden');
                mobileMenu.classList.toggle('hidden', isHidden);
                if (menuPath) {
                    menuPath.setAttribute('d', isHidden ? hamburgerPath : closePath);
                }
            };

            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => toggleMenu(false));
            });

            // Close on click outside
            document.addEventListener('click', (e) => {
                if (!mobileMenu.classList.contains('hidden') && !mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                    toggleMenu(false);
                }
            });

            // Close on Escape
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
                    toggleMenu(false);
                }
            });
        }

        /* Engineered Excellence carousel — infinite round-robin reel */
        (function initEngineeredExcellenceCarousel() {
            const AUTO_MS = 5000;
            const root = document.getElementById('ee-root');
            const viewport = document.getElementById('ee-viewport');
            const dotsHost = document.getElementById('ee-dots');
            const btnPrev = document.getElementById('ee-prev');
            const btnNext = document.getElementById('ee-next');
            if (!root || !viewport || !dotsHost || !btnPrev || !btnNext) return;

            const originals = Array.from(viewport.querySelectorAll('.ee-card'));
            const slideCount = originals.length;
            if (!slideCount) {
                root.closest('section')?.classList.add('hidden');
                return;
            }

            let reelReady = false;
            let teleporting = false;

            if (slideCount >= 2) {
                const first = originals[0];
                const last = originals[slideCount - 1];
                const clonePrev = last.cloneNode(true);
                clonePrev.classList.add('ee-clone', 'ee-clone-prev');
                clonePrev.setAttribute('aria-hidden', 'true');
                const cloneNext = first.cloneNode(true);
                cloneNext.classList.add('ee-clone', 'ee-clone-next');
                cloneNext.setAttribute('aria-hidden', 'true');
                viewport.insertBefore(clonePrev, first);
                viewport.appendChild(cloneNext);
                reelReady = true;
            }

            function closestDomIndex() {
                const viewMid = viewport.scrollLeft + viewport.clientWidth / 2;
                let best = 0;
                let bestDist = Infinity;
                for (let d = 0; d < viewport.children.length; d++) {
                    const el = viewport.children[d];
                    const mid = el.offsetLeft + el.offsetWidth / 2;
                    const dist = Math.abs(mid - viewMid);
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = d;
                    }
                }
                return best;
            }

            function logicalFromDom(d) {
                const el = viewport.children[d];
                if (!el) return 0;
                if (el.classList.contains('ee-clone-prev')) return slideCount - 1;
                if (el.classList.contains('ee-clone-next')) return 0;
                return d - 1;
            }

            function currentLogical() {
                return logicalFromDom(closestDomIndex());
            }

            function scrollToDom(domIndex, smooth) {
                const el = viewport.children[domIndex];
                if (!el) return;
                const left = el.offsetLeft - (viewport.clientWidth - el.offsetWidth) / 2;
                const x = Math.max(0, left);
                if (!smooth) {
                    teleporting = true;
                    const prevSnap = viewport.style.scrollSnapType;
                    viewport.style.scrollSnapType = 'none';
                    viewport.style.scrollBehavior = 'auto';
                    viewport.scrollLeft = x;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            viewport.style.scrollSnapType = prevSnap || '';
                            viewport.style.scrollBehavior = '';
                            teleporting = false;
                        });
                    });
                } else {
                    viewport.scrollTo({ left: x, behavior: 'smooth' });
                }
            }

            function handleInfiniteTeleport() {
                if (!reelReady || teleporting) return;
                const d = closestDomIndex();
                const el = viewport.children[d];
                if (!el) return;
                if (el.classList.contains('ee-clone-next')) {
                    scrollToDom(1, false);
                } else if (el.classList.contains('ee-clone-prev')) {
                    scrollToDom(slideCount, false);
                }
            }

            function goToLogical(i, smooth) {
                const idx = ((i % slideCount) + slideCount) % slideCount;
                scrollToDom(idx + 1, smooth);
                syncDots(idx);
            }

            function navigateNext(smooth) {
                if (slideCount < 2) return;
                const i = currentLogical();
                if (reelReady && i >= slideCount - 1) {
                    scrollToDom(slideCount + 1, smooth);
                } else if (i < slideCount - 1) {
                    scrollToDom(i + 2, smooth);
                }
            }

            function navigatePrev(smooth) {
                if (slideCount < 2) return;
                const i = currentLogical();
                if (reelReady && i === 0) {
                    scrollToDom(0, smooth);
                } else if (i > 0) {
                    scrollToDom(i, smooth);
                }
            }

            let autoDisabled = false;
            let hoverInside = false;
            let hadClickWhileHovered = false;
            let touchActiveOnSlide = false;
            let timerId = null;
            let touchResumeTimer = null;

            function stopAutoTimer() {
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
            }

            function shouldRunAuto() {
                if (autoDisabled) return false;
                if (hoverInside) return false;
                if (touchActiveOnSlide) return false;
                return true;
            }

            function startAutoTimer() {
                stopAutoTimer();
                if (!shouldRunAuto()) return;
                timerId = setInterval(() => {
                    if (!shouldRunAuto()) return;
                    if (slideCount < 2) return;
                    navigateNext(true);
                }, AUTO_MS);
            }

            function disableAutoPermanently() {
                autoDisabled = true;
                stopAutoTimer();
            }

            function syncDots(active) {
                dotsHost.querySelectorAll('.ee-dot').forEach((dot, i) => {
                    const on = i === active;
                    dot.setAttribute('aria-current', on ? 'true' : 'false');
                    dot.setAttribute('tabindex', on ? '0' : '-1');
                });
            }

            function buildDots() {
                dotsHost.innerHTML = '';
                for (let i = 0; i < slideCount; i++) {
                    const dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'ee-dot';
                    dot.setAttribute('role', 'tab');
                    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
                    dot.addEventListener('click', () => {
                        disableAutoPermanently();
                        goToLogical(i, true);
                    });
                    dotsHost.appendChild(dot);
                }
                syncDots(currentLogical());
            }

            let scrollTick = null;
            let settleTimer = null;

            function onScrollUpdate() {
                syncDots(currentLogical());
            }

            viewport.addEventListener('scroll', () => {
                if (scrollTick) cancelAnimationFrame(scrollTick);
                scrollTick = requestAnimationFrame(() => {
                    scrollTick = null;
                    onScrollUpdate();
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        handleInfiniteTeleport();
                        onScrollUpdate();
                    }, 120);
                });
            }, { passive: true });

            viewport.addEventListener('scrollend', () => {
                handleInfiniteTeleport();
                onScrollUpdate();
            }, { passive: true });

            btnPrev.addEventListener('click', () => {
                disableAutoPermanently();
                navigatePrev(true);
            });
            btnNext.addEventListener('click', () => {
                disableAutoPermanently();
                navigateNext(true);
            });

            root.addEventListener('mouseenter', () => {
                hoverInside = true;
                hadClickWhileHovered = false;
                stopAutoTimer();
            });
            root.addEventListener('mouseleave', () => {
                hoverInside = false;
                const blockResume = hadClickWhileHovered;
                hadClickWhileHovered = false;
                if (!blockResume && !autoDisabled) startAutoTimer();
            });
            root.addEventListener('click', () => {
                if (hoverInside) hadClickWhileHovered = true;
            }, true);

            viewport.addEventListener('touchstart', (e) => {
                if (e.target.closest('.ee-card')) {
                    touchActiveOnSlide = true;
                    stopAutoTimer();
                }
            }, { passive: true });
            viewport.addEventListener('touchend', () => {
                if (touchResumeTimer) clearTimeout(touchResumeTimer);
                touchResumeTimer = setTimeout(() => {
                    touchActiveOnSlide = false;
                    touchResumeTimer = null;
                    if (!autoDisabled && !hoverInside) startAutoTimer();
                }, 100);
            }, { passive: true });
            viewport.addEventListener('touchcancel', () => {
                if (touchResumeTimer) clearTimeout(touchResumeTimer);
                touchResumeTimer = setTimeout(() => {
                    touchActiveOnSlide = false;
                    touchResumeTimer = null;
                    if (!autoDisabled && !hoverInside) startAutoTimer();
                }, 100);
            }, { passive: true });

            buildDots();
            if (reelReady) {
                scrollToDom(1, false);
            }
            startAutoTimer();
            requestAnimationFrame(() => {
                handleInfiniteTeleport();
                onScrollUpdate();
            });
        })();

        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        const modal = document.getElementById('pdf-modal');
        const pdfFrame = document.getElementById('pdf-frame');
        const modalTitle = document.getElementById('modal-title');

        // Schematic Scroll & Tab Sync Logic
        const scrollContainer = document.getElementById('arch-scroll');
        const metricTabs = document.querySelectorAll('.metric-tab');

        if (scrollContainer && metricTabs.length) {
            scrollContainer.addEventListener('scroll', () => {
                const containerWidth = scrollContainer.offsetWidth;
                const scrollLeft = scrollContainer.scrollLeft;
                const center = scrollLeft + (containerWidth / 2);
                
                let closestIndex = 0;
                let minDistance = Infinity;

                scrollContainer.querySelectorAll('.arch-card').forEach((card, index) => {
                    const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                    const distance = Math.abs(center - cardCenter);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestIndex = index;
                    }
                });

                metricTabs.forEach((tab, i) => {
                    const span = tab.querySelector('span');
                    const line = tab.querySelector('div:last-child');
                    
                    if (i === closestIndex) {
                        span.classList.remove('text-slate-400');
                        span.classList.add('text-blue-400');
                        line.classList.replace('w-0', 'w-6');
                        line.classList.replace('bg-transparent', 'bg-blue-400');
                        
                        // Ensure card gets glowing borders
                        const card = scrollContainer.querySelectorAll('.arch-card')[i];
                        card.classList.add('border-blue-500', 'shadow-[0_0_30px_rgba(59,130,246,0.15)]');
                        card.classList.remove('border-slate-800/60');
                    } else {
                        span.classList.add('text-slate-400');
                        span.classList.remove('text-blue-400');
                        line.classList.replace('w-6', 'w-0');
                        line.classList.replace('bg-blue-400', 'bg-transparent');
                        
                        // Remove glowing borders
                        const card = scrollContainer.querySelectorAll('.arch-card')[i];
                        card.classList.remove('border-blue-500', 'shadow-[0_0_30px_rgba(59,130,246,0.15)]');
                        card.classList.add('border-slate-800/60');
                    }
                });
            });

            metricTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const index = tab.getAttribute('data-index');
                    const target = scrollContainer.querySelector(`.arch-card[data-index="${index}"]`);
                    if (target) {
                        scrollContainer.scrollTo({
                            left: target.offsetLeft - (scrollContainer.offsetWidth / 2) + (target.offsetWidth / 2),
                            behavior: 'smooth'
                        });
                    }
                });
            });
            
            // Trigger scroll event on load to set initial state
            scrollContainer.dispatchEvent(new Event('scroll'));
        }

        function openModal(url, title) {
            if (!url || url === '#') {
                pdfFrame.src = "about:blank"; 
                modalTitle.textContent = title;
                modal.classList.add('modal-open');
                document.body.style.overflow = 'hidden';
                return;
            }
            pdfFrame.src = url;
            modalTitle.textContent = title;
            modal.classList.add('modal-open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('modal-open');
            setTimeout(() => { pdfFrame.src = ''; }, 300);
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            const multiplier = window.innerWidth < 768 ? 25000 : 14000;
            const numberOfParticles = (canvas.width * canvas.height) / multiplier;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = window.innerWidth < 768 ? 0.8 : 1.2;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = (Math.random() - 0.5) * 0.15;
                this.color = '#3b82f6';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const limit = window.innerWidth < 768 ? 100 : 180;
                    if (distance < limit) {
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.15 * (1 - distance/limit)})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        window.addEventListener('load', () => {
            initCanvas();
            animate();
        });
    </script>
</body>
